<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <title>Live Comments</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="description" content="ความคิดเห็นสดแบบเรียลไทม์สำหรับงานอีเวนต์และไลฟ์" />

  <!-- Content Security Policy (M5) — Firebase bundled local, no scripts from gstatic -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' https://browser.sentry-cdn.com;
    style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
    font-src https://fonts.gstatic.com;
    img-src 'self' data: blob:;
    connect-src 'self' https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com https://*.firebasedatabase.app wss://*.firebasedatabase.app https://*.google.com https://www.gstatic.com https://*.sentry.io https://sentry.io;
    manifest-src 'self';
    worker-src 'self';
    base-uri 'self';
    object-src 'none';
  " />

  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#090a1a">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/icon-192.png">

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@300;400;500;600&family=Noto+Sans+Thai:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <!-- Skip navigation (a11y) -->
  <a href="#comment-feed" class="skip-link">ข้ามไปยังความคิดเห็น</a>

  <!-- Background (decorative) -->
  <div class="bg-orb orb-1" aria-hidden="true"></div>
  <div class="bg-orb orb-2" aria-hidden="true"></div>
  <div class="bg-orb orb-3" aria-hidden="true"></div>

  <!-- Header -->
  <header class="glass-header" role="banner">
    <div class="header-inner">

      <div class="live-badge">
        <span class="live-dot" aria-hidden="true"></span>
        <!-- ปุ่ม LIVE เปิด admin clear เมื่อ long-press / click โดย admin -->
        <button
          id="clear-btn"
          class="live-label"
          aria-label="LIVE — กดเพื่อจัดการในฐานะ admin"
        >LIVE</button>
      </div>

      <div class="header-title">
        <h1>ความคิดเห็น</h1>
      </div>

      <div class="viewer-count" aria-label="จำนวนผู้ชม">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" focusable="false">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
        </svg>
        <span id="viewer-count" aria-live="polite" aria-atomic="true">0</span>
      </div>

    </div>
  </header>

  <!-- Feed -->
  <main
    id="comment-feed"
    class="comment-feed"
    role="log"
    aria-live="polite"
    aria-label="ความคิดเห็นสด"
    aria-relevant="additions"
  >
    <div class="feed-spacer-top" aria-hidden="true"></div>
    <div class="feed-spacer-bottom" aria-hidden="true"></div>
  </main>

  <!-- Input -->
  <footer class="glass-footer" role="contentinfo">
    <div class="input-row">
      <div class="avatar-self" aria-hidden="true">
        <span id="self-initial">A</span>
      </div>

      <label for="comment-input" class="sr-only">แสดงความคิดเห็น</label>
      <div class="input-wrapper glass-input">
        <input
          type="text"
          id="comment-input"
          placeholder="แสดงความคิดเห็น…"
          maxlength="200"
          autocomplete="off"
          autocorrect="off"
          spellcheck="false"
          aria-describedby="char-count"
        />
      </div>

      <button class="send-btn" id="send-btn" aria-label="ส่งความคิดเห็น">➤</button>
    </div>

    <div
      id="char-count"
      class="char-count"
      aria-live="polite"
      aria-atomic="true"
      aria-label="อักขระที่เหลือ"
    >200</div>
  </footer>

  <!-- Welcome modal -->
  <div
    class="modal-overlay"
    id="modal-overlay"
    role="dialog"
    aria-modal="true"
    aria-labelledby="modal-title"
    aria-describedby="modal-desc"
  >
    <div class="modal glass-card">
      <div class="modal-icon" aria-hidden="true">💬</div>
      <h2 class="modal-title" id="modal-title">ยินดีต้อนรับ</h2>
      <p class="modal-subtitle" id="modal-desc">ใส่ชื่อของคุณเพื่อเข้าร่วม</p>

      <label for="name-input" class="sr-only">ชื่อของคุณ</label>
      <input
        type="text"
        id="name-input"
        class="glass-input name-field"
        placeholder="ชื่อของคุณ"
        maxlength="20"
        autocomplete="nickname"
      />

      <button class="join-btn" id="join-btn">เข้าร่วม Live</button>
    </div>
  </div>

  <!-- App entry (Vite bundles Firebase + src/ modules) -->
  <script type="module" src="/src/main.js"></script>

</body>
</html>
